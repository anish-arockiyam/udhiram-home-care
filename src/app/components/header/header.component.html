<header class="site-header">
  <div class="nav-shell container">
    <a class="brand" href="#home" (click)="closeMenu()" aria-label="Udhiram Home Care Nursing home">
      <!-- <span class="brand-mark"><udhiram-icon name="home" [size]="22" /></span> -->
       <img
          src="assets/logo.png"
          alt="Udhiram Home Care Nursing"
          class="brand-logo"
        />
      <span class="brand-copy">
        <strong>UDHIRAM</strong>
        <small>HOME CARE NURSING</small>
      </span>
    </a>

    <button class="menu-button" type="button" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen()" aria-controls="mobile-nav"
            aria-label="Toggle navigation">
      <udhiram-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="25" />
    </button>

    <nav class="desktop-nav" aria-label="Primary navigation">
      <a href="#home">Home</a>
      <a href="#services">Our Services</a>
      <a href="#founder">Our Founder</a>
      <a href="#why-choose">Why Choose Us</a>
      <a href="#why-trust">Why Trust Us</a>
      <a href="#contact">Contact</a>
      <a class="nav-cta" href="#contact">Contact Us <udhiram-icon name="arrow" [size]="16" /></a>
    </nav>
  </div>

  <nav id="mobile-nav" class="mobile-nav" [class.open]="menuOpen()" aria-label="Mobile navigation">
    <a href="#home" (click)="closeMenu()">Home</a>
    <a href="#services" (click)="closeMenu()">Our Services</a>
    <a href="#founder" (click)="closeMenu()">Our Founder</a>
    <a href="#why-choose" (click)="closeMenu()">Why Choose Us</a>
    <a href="#why-trust" (click)="closeMenu()">Why Trust Us</a>
    <a href="#contact" (click)="closeMenu()">Contact</a>
    <a class="nav-cta" href="#contact" (click)="closeMenu()">Contact Us <udhiram-icon name="arrow" [size]="16" /></a>
  </nav>
</header>
